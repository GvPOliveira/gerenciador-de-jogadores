<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Incluir jogador - Gerenciador de Jogadores de Futebol</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <header class="cabecalho">
        <h1>Gerenciador de Jogadores de Futebol</h1>
    </header>

    <section class="formulario-container">

        <h2>Incluir novo jogador</h2>

        <form class="formulario-jogador" id="formInclusao" novalidate>

            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>
                <span class="erro" id="erroNome"></span>
            </div>

            <div class="campo">
                <label for="numeroCamisa">Número da camisa</label>
                <input type="number" id="numeroCamisa" name="numeroCamisa"
                       min="1" max="99" required>
                <span class="erro" id="erroNumeroCamisa"></span>
            </div>

            <div class="campo">
                <label for="times">Time</label>
                <select id="times" name="time" required>
                    <option value="">Selecione um time</option>
                </select>
                <span class="erro" id="erroTime"></span>
            </div>

            <div class="campo campo-lesionado">

                <span>Lesionado</span>

                <div class="opcoes-lesionado">

                    <label>
                        <input type="radio" name="lesionado"
                               value="nao" checked>
                        Não
                    </label>

                    <label>
                        <input type="radio" name="lesionado"
                               value="sim">
                        Sim
                    </label>

                </div>
                <span class="erro" id="erroLesionado"></span>

            </div>

            <div class="campo campo-observacoes">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes" name="observacoes"></textarea>
                <span class="erro" id="erroObservacoes"></span>
            </div>

            <div class="formulario-acoes">
                <button type="submit" class="btn-salvar">
                    Salvar
                </button>
            </div>

        </form>

    </section>

    <footer class="rodape">
        <p>Gabriel Vinicius Pereira de Oliveira / Turma: 3A Noturno / Ano: 2026</p>
        <p>Usou IA: SIM. Claude, no desenvolvimento dos htmls, css, ensinando como lidar com alguns elementos do Html
            através do JavaScript e desenvolvimento do read-me.</p>
    </footer>

</main>

<script src="incluir.js"></script>
</body>

</html>
